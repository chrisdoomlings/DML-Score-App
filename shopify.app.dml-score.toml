# DML Score — register this as a brand new app in the Shopify Partner Dashboard,
# then fill in client_id and application_url.
# This app is fully independent: its own Vercel project, its own Supabase DB.

client_id = "d734ad498a12a1cb97c00a4c3acff70f"
name = "DML Score"
application_url = "https://dml-score-nine.vercel.app"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks"

[access_scopes]
# Customer read access only — the score tool identifies logged-in customers
# via the app proxy; it does not write to customer records in phase 1.
scopes = "read_customers"

[auth]
redirect_urls = [
  "https://dml-score-nine.vercel.app/auth/callback"
]

[pos]
embedded = false

[app_proxy]
url = "https://dml-score-nine.vercel.app/api/proxy"
subpath = "score"
prefix = "apps"

# This app doesn't use Shopify Events (still developer-preview, unstable
# API version only) — but current Shopify CLI requires [events] to be
# present regardless of whether it's used, or `deploy` fails validation.
# uri points at the same handler [webhooks] already uses; that handler only
# acts on topic == "app/uninstalled" and no-ops for anything else, so an
# actual "Product" delivery here (which shouldn't happen — nothing about
# this app subscribes it to real product changes) is harmless either way.
[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "unused-stub"
  # "Customer" specifically because it's covered by the read_customers scope
  # this app already declares — avoids requesting any new scope just to
  # satisfy this otherwise-unused stub.
  topic = "Customer"
  actions = ["create"]
  uri = "/api/webhooks"
