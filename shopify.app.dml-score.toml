# DML Score — register this as a brand new app in the Shopify Partner Dashboard,
# then fill in client_id and application_url.
# This app is fully independent: its own Vercel project, its own Supabase DB.

client_id = "d734ad498a12a1cb97c00a4c3acff70f"
name = "DML Score"
application_url = "https://dml-score-nine.vercel.app"
embedded = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/webhooks"

[access_scopes]
# Customer read access only — the score tool identifies logged-in customers
# via the app proxy; it does not write to customer records in phase 1.
scopes = "read_customers"

[auth]
redirect_urls = [
  "https://dml-score-nine.vercel.app/auth/callback"
]

[pos]
embedded = false

[app_proxy]
url = "https://dml-score-nine.vercel.app/api/proxy"
subpath = "score"
prefix = "apps"

# This app doesn't use Shopify Events, but current Shopify CLI requires
# [events] to be present regardless (see the "[events]: Required" /
# "[events.api_version]: Required" validation errors otherwise). Same
# api_version as [webhooks] above, for consistency — no subscriptions.
[events]
api_version = "2026-01"
